name: Python backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the locked project environment
        run: python scripts/bootstrap.py
      - name: Validate the dependency lockfile
        working-directory: apps/api
        run: ../../.tools/uv/bin/uv lock --check
      - name: Check Python formatting and HTTP contracts
        run: python scripts/api.py check
